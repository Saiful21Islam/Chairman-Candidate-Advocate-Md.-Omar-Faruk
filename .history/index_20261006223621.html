          <div><span class="block text-xs font-bold text-slate-500" data-bn="পেশা" data-en="Profession"></span><span class="font-semibold text-base" data-bn="আইনজীবী (এডভোকেট)" data-en="Lawyer (Advocate)"></span></div>

  <section id="manifesto" class="py-16 bg-slate-50">
    <div class="container mx-auto px-4">
      <div class="text-center max-w-3xl mx-auto mb-10">
        <h2 class="font-serif text-3xl font-extrabold text-navy-900" data-bn="জনগণের চাহিদা ও প্রস্তাবিত পরিকল্পনা" data-en="Citizen Demands & Proposed Plan"></h2>
        <p class="text-slate-600 text-sm mt-2" data-bn="কোনো ফাঁকা ইশতেহার নয়; আপনার ওয়ার্ডের প্রধান সমস্যাগুলো জানা এবং সুনির্দিষ্ট পরিকল্পনা তৈরি করাই আমাদের উদ্দেশ্য।" data-en="No empty manifesto; our goal is to identify specific ward issues and build realistic plans."></p>
        <div class="w-16 h-1 bg-gold-500 mx-auto mt-3 rounded-full"></div>
      </div>

      <div class="text-center mt-10"><a href="#citizen-portal" class="bg-navy-900 hover:bg-royal-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition inline-block"><i class="fa-solid fa-pen-to-square text-gold-400 mr-2"></i><span data-bn="আপনার এলাকা সম্পর্কে বলুন" data-en="Tell Us About Your Ward"></span></a></div>
    </div>
  </section>

  <!-- CITIZEN PORTAL SECTION -->
  <section id="citizen-portal" class="py-16 bg-white">
    <div class="container mx-auto px-4">
      <div class="text-center max-w-3xl mx-auto mb-10">
        <h2 class="font-serif text-3xl font-extrabold text-navy-900" data-bn="নাগরিক সমস্যা ও মতামত সাবমিট করার পোর্টাল" data-en="Submit Issues & Feedback Portal"></h2>
        <p class="text-slate-600 text-sm mt-2" data-bn="আপনার ওয়ার্ডের সমস্যা বা গঠনমূলক পরামর্শ লিখে জমা দিন। আপনার মোবাইল নম্বর জনসমক্ষে প্রকাশ করা হবে না।" data-en="Write your area's issue or feedback. Your mobile number will remain private."></p>
        <div class="w-16 h-1 bg-gold-500 mx-auto mt-3 rounded-full"></div>
      </div>
      <form id="issueForm" class="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-10 border border-slate-200 shadow-soft space-y-5">
        <div class="grid sm:grid-cols-2 gap-5">
          <label class="block text-xs font-bold text-slate-700"><span data-bn="আপনার নাম *" data-en="Your Name *"></span>
            <input id="iName" required class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-normal"></label>
          <label class="block text-xs font-bold text-slate-700"><span data-bn="ওয়ার্ড *" data-en="Ward *"></span>
            <select id="iWard" required class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-normal bg-white"></select></label>
          <label class="block text-xs font-bold text-slate-700"><span data-bn="মোবাইল নম্বর *" data-en="Mobile *"></span>
            <input id="iPhone" type="tel" inputmode="tel" required placeholder="0186991321" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-normal"></label>
          <label class="block text-xs font-bold text-slate-700"><span data-bn="বিষয় *" data-en="Topic *"></span>
            <select id="iCat" required class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-normal bg-white"></select></label>
        </div>
        <label class="block text-xs font-bold text-slate-700"><span data-bn="সমস্যার শিরোনাম *" data-en="Title *"></span>
          <input id="iTitle" required class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-normal"></label>
        <label class="block text-xs font-bold text-slate-700"><span data-bn="বিস্তারিত ব্যাখ্যা *" data-en="Details *"></span>
          <textarea id="iDesc" rows="4" required class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-normal"></textarea></label>
        <div class="flex flex-col sm:flex-row gap-3">
          <button type="button" onclick="openPreview()" class="sm:w-1/2 bg-slate-100 hover:bg-slate-200 font-bold py-3.5 rounded-xl border border-slate-300 transition"><i class="fa-solid fa-eye text-royal-600 mr-2"></i><span data-bn="প্রিভিউ দেখুন" data-en="Preview"></span></button>
          <button type="submit" class="sm:w-1/2 bg-navy-900 hover:bg-royal-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition"><i class="fa-solid fa-paper-plane text-gold-400 mr-2"></i><span data-bn="জমা দিন" data-en="Submit"></span></button>
        </div>
        <p id="iMsg" class="text-sm font-semibold min-h-[1.5em]" role="status"></p>
      </form>
    </div>
  </section>

  <!-- FEED SECTION -->

      <div id="feedBox" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  <!-- VOLUNTEER SECTION -->
  <section id="volunteer" class="py-16 bg-white">
    <div class="container mx-auto px-4 max-w-3xl">
      <div class="text-center mb-8">
        <h2 class="font-serif text-3xl font-extrabold text-navy-900" data-bn="আমাদের সঙ্গে যুক্ত হোন" data-en="Join Our Team"></h2>
        <p class="text-slate-600 text-sm mt-2" data-bn="প্রচার ও ভোটকেন্দ্র ব্যবস্থাপনায় স্বেচ্ছাসেবক হিসেবে নাম লিখুন।" data-en="Sign up as a volunteer for campaigning and polling-centre support."></p>
      </div>
      <form id="volForm" class="bg-slate-50 rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-soft grid sm:grid-cols-3 gap-4">
        <input id="vName" required data-bn="আপনার নাম" data-en="Your name" class="px-4 py-3 rounded-xl border border-slate-300 text-sm">
        <input id="vPhone" type="tel" inputmode="tel" required data-bn="মোবাইল নম্বর" data-en="Mobile" class="px-4 py-3 rounded-xl border border-slate-300 text-sm">
        <select id="vWard" required class="px-4 py-3 rounded-xl border border-slate-300 text-sm bg-white"></select>
        <button class="sm:col-span-3 bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl transition"><i class="fa-brands fa-whatsapp mr-2"></i><span data-bn="WhatsApp-এ নাম পাঠান" data-en="Send via WhatsApp"></span></button>
      </form>
    </div>
  </section>

    <div class="container mx-auto px-4 max-w-3xl">
